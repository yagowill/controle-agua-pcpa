name: Deploy to Fly.io

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create app if needed (first deploy)
        run: flyctl apps create controle-agua-pcpa --org yago-martins-366 || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Sync secrets
        run: |
          flyctl secrets set \
            APP_KEY="${{ secrets.APP_KEY }}" \
            APP_URL="https://controle-agua-pcpa.fly.dev" \
            DB_CONNECTION="pgsql" \
            DB_HOST="${{ secrets.DB_HOST }}" \
            DB_PORT="5432" \
            DB_DATABASE="${{ secrets.DB_DATABASE }}" \
            DB_USERNAME="${{ secrets.DB_USERNAME }}" \
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            DB_SSLMODE="require" \
            --app scea-controle-agua-pcpa
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --app controle-agua-pcpa
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
