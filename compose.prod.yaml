# Produção do SCEA/PCPA em uma VM (Oracle Cloud Always Free, VPS, etc.).
#
# Uso:
#   cp .env.production.example .env.production
#   # edite APP_DOMAIN, APP_KEY, senhas e demais variáveis
#   docker compose -f compose.prod.yaml up -d --build
#
# O Caddy termina o HTTPS e encaminha o tráfego para o Apache do serviço `app`.
# O PostgreSQL não expõe porta no host.

name: scea-prod

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    image: scea-app:prod
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${PORT:-80}/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    env_file:
      - .env.production
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
