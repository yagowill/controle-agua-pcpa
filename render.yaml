# Deploy do SCEA/PCPA no Render (web service Docker, plano free) com o banco
# PostgreSQL hospedado no Neon.
#
# Passo a passo completo em README.md, secção "Deploy no Render + Neon".
#
# Observações:
#   - o Render constrói o último stage do Dockerfile (produção), por isso o
#     campo `target` não é necessário (e não é suportado no Blueprint);
#   - os segredos usam `sync: false`, ou seja, são pedidos no dashboard e não
#     ficam versionados;
#   - o entrypoint aplica as migrations a cada deploy e só roda o seeder
#     quando RUN_SEEDER=true.

services:
  - type: web
    name: scea-pcpa
    runtime: docker
    region: virginia
    plan: free
    dockerfilePath: ./docker/php/Dockerfile
    dockerContext: .
    healthCheckPath: /up
    autoDeployTrigger: commit
    envVars:
      - key: APP_NAME
        value: "SCEA - PCPA"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_FORCE_HTTPS
        value: "true"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        fromService:
          name: scea-pcpa
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_LOCALE
        value: pt_BR
      - key: APP_FALLBACK_LOCALE
        value: pt_BR
      - key: APP_FAKER_LOCALE
        value: pt_BR
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: MAIL_MAILER
        value: log
      # Cria o administrador inicial no primeiro deploy. Depois de entrar no
      # sistema e trocar a senha, altere para "false" no dashboard do Render.
      - key: RUN_SEEDER
        value: "false"
