; Configuração PHP do SCEA/PCPA
; Ajustes voltados ao uso do Dompdf (memória), PhpSpreadsheet (zip) e uploads pequenos.

memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 120
max_input_vars = 3000

date.timezone = America/Belem
default_charset = "UTF-8"

expose_php = Off
