# Configuração do SCEA/PCPA no Fly.io.
#
# A aplicação roda na região `gru` (São Paulo) e usa o PostgreSQL do Neon em
# `aws-sa-east-1` (também São Paulo), ligado pelo segredo DB_URL.
#
# Passo a passo completo em README.md, secção "Deploy no Fly.io + Neon".
#
# Observações:
#   - o Fly.io constrói o stage `production` do docker/php/Dockerfile
#     (build-target);
#   - PORT=8080 faz o entrypoint reconfigurar o Apache para a porta interna
#     usada pelo Fly.io (internal_port);
#   - APP_KEY e DB_URL são segredos e ficam fora do repositório:
#       fly secrets set APP_KEY=... DB_URL=... -a controle-agua-pcpa
#   - o entrypoint aplica as migrations a cada start e só roda o seeder quando
#     RUN_SEEDER=true (prefira `fly ssh console -C "php artisan db:seed --force"`);
#   - a Machine para por inatividade (auto_stop_machines) e volta no primeiro
#     pedido; não é necessário volume porque a aplicação não guarda uploads.

app = 'controle-agua-pcpa'
primary_region = 'gru'

[build]
  dockerfile = 'docker/php/Dockerfile'
  build-target = 'production'

[env]
  APP_NAME = "SCEA - PCPA"
  APP_ENV = "production"
  APP_DEBUG = "false"
  APP_FORCE_HTTPS = "true"
  APP_LOCALE = "pt_BR"
  APP_FALLBACK_LOCALE = "pt_BR"
  APP_FAKER_LOCALE = "pt_BR"
  BCRYPT_ROUNDS = "12"
  LOG_CHANNEL = "stderr"
  LOG_LEVEL = "warning"
  DB_CONNECTION = "pgsql"
  DB_SSLMODE = "require"
  SESSION_DRIVER = "database"
  SESSION_LIFETIME = "120"
  SESSION_SECURE_COOKIE = "true"
  SESSION_SAME_SITE = "lax"
  CACHE_STORE = "database"
  QUEUE_CONNECTION = "database"
  FILESYSTEM_DISK = "local"
  MAIL_MAILER = "log"
  RUN_SEEDER = "false"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/up"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
