# fly.toml app configuration file generated for controle-agua-pcpa on 2026-10-30T23:39:52Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'controle-agua-pcpa'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_ENV = 'production'
  APP_DEBUG = 'false'
  APP_URL = 'https://controle-agua-pcpa.fly.dev'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'info'
  DB_CONNECTION = 'pgsql'
  SESSION_DRIVER = 'database'
  CACHE_STORE = 'database'
  QUEUE_CONNECTION = 'database'
  FILESYSTEM_DISK = 'local'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']
  checks = [{ grace_period = '30s', interval = '30s', method = 'GET', path = '/up', timeout = '5s' }]

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
