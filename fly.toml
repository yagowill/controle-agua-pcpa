# fly.toml app configuration file
app = 'controle-agua-pcpa'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_ENV = 'production'
  APP_DEBUG = 'false'
  APP_URL = 'https://controle-agua-pcpa.fly.dev'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'info'
  DB_CONNECTION = 'pgsql'
  SESSION_DRIVER = 'database'
  CACHE_STORE = 'database'
  QUEUE_CONNECTION = 'database'
  FILESYSTEM_DISK = 'local'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/up'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1